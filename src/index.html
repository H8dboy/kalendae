<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AGENDA/H8</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>
<div id="app">

  <!-- header: nome a sinistra, icone Task/Note e menu a destra -->
  <header id="topbar">
    <button class="icon-btn" id="backBtn" aria-label="Indietro" hidden>←</button>
    <h1 id="screenTitle">AGENDA/H8</h1>
    <div class="spacer"></div>
    <button class="icon-btn" id="searchBtn" aria-label="Cerca">⌕</button>
    <button class="icon-btn" id="tasksBtn" aria-label="Task">☑</button>
    <button class="icon-btn" id="notesBtn" aria-label="Note">📄</button>
    <button class="icon-btn" id="menuBtn" aria-label="Menu" aria-haspopup="true">⋮</button>
  </header>

  <!-- menu ⋮ -->
  <nav id="menuPop" aria-label="Menu">
    <button id="mFitness">🏋 <span data-i18n="fitness"></span></button>
    <button id="mArchive">🗂 <span data-i18n="archive"></span></button>
    <button id="mStats">📊 <span data-i18n="stats"></span></button>
    <button id="mSettings">⚙ <span data-i18n="settings"></span></button>
  </nav>

  <main>
    <!-- ============ CALENDARIO (schermata principale) ============ -->
    <section class="screen" id="screen-calendar">
      <div id="quickadd">
        <input type="text" id="quickInput" autocomplete="off" />
      </div>
      <div id="pickBanner" hidden>
        <span id="pickLabel"></span>
        <button class="btn small" id="pickCancel">✕</button>
      </div>
      <div id="calHead">
        <button class="icon-btn" id="calPrev" aria-label="Precedente">‹</button>
        <button id="calLabel" aria-label="Vai a mese e anno"></button>
        <button class="icon-btn" id="calNext" aria-label="Successivo">›</button>
        <button class="btn small" id="todayBtn"></button>
      </div>
      <div id="calTabs" role="tablist">
        <button class="tab active" data-view="month" role="tab"></button>
        <button class="tab" data-view="week" role="tab"></button>
        <button class="tab" data-view="day" role="tab"></button>
      </div>
      <div id="calBody"></div>
      <button class="fab" id="fabCal" aria-label="Nuova attività">+</button>
    </section>

    <!-- ============ TASK ============ -->
    <section class="screen" id="screen-tasks" hidden>
      <div class="filters" id="taskFilters"></div>
      <div class="scroll" id="taskList"></div>
      <button class="fab" id="fabTask" aria-label="Nuova task">+</button>
    </section>

    <!-- ============ NOTE: cartelle → elenco note → editor ============ -->
    <section class="screen" id="screen-notes" hidden>
      <div class="scroll" id="folderList"></div>
      <button class="fab" id="fabFolder" aria-label="Nuova cartella">+</button>
    </section>

    <section class="screen" id="screen-notelist" hidden>
      <div class="scroll" id="noteList"></div>
      <button class="fab" id="fabNote" aria-label="Nuova nota">+</button>
    </section>

    <section class="screen" id="screen-noteedit" hidden>
      <div id="noteEditor">
        <input type="text" id="noteTitle" />
        <textarea id="noteBody"></textarea>
        <div id="noteMeta"></div>
      </div>
    </section>

    <!-- ============ RICERCA ============ -->
    <section class="screen" id="screen-search" hidden>
      <div id="searchBar">
        <input type="search" id="searchInput" autocomplete="off" />
      </div>
      <div class="scroll" id="searchResults"></div>
    </section>

    <!-- ============ ARCHIVIO FATTE ============ -->
    <section class="screen" id="screen-archive" hidden>
      <div class="filters" id="archiveFilters"></div>
      <div class="scroll" id="archiveList"></div>
    </section>

    <!-- ============ STATISTICHE ============ -->
    <section class="screen" id="screen-stats" hidden>
      <div class="scroll" id="statsBody"></div>
    </section>

    <!-- ============ IMPOSTAZIONI ============ -->
    <section class="screen" id="screen-settings" hidden>
      <div class="scroll" id="settingsBody"></div>
    </section>

    <!-- ============ FITNESS: sport → dettaglio sport → scheda ============ -->
    <section class="screen" id="screen-fitness" hidden>
      <div class="scroll" id="sportList"></div>
      <button class="fab" id="fabSport" aria-label="Nuovo sport">+</button>
    </section>

    <section class="screen" id="screen-sport" hidden>
      <div class="scroll" id="sportBody"></div>
    </section>

    <section class="screen" id="screen-plan" hidden>
      <div class="scroll" id="planBody"></div>
      <button class="fab" id="fabExercise" aria-label="Nuovo esercizio">+</button>
    </section>
  </main>
</div>

<!-- ============ modale attività ============ -->
<div class="overlay" id="actOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="actTitle">
    <h3 id="actTitle"></h3>
    <label for="fTitle" data-i18n="title_label"></label>
    <input id="fTitle" type="text" maxlength="200" />
    <label for="fDesc" data-i18n="description_label"></label>
    <textarea id="fDesc" maxlength="2000"></textarea>
    <label for="fGroup" data-i18n="group_label"></label>
    <select id="fGroup"></select>
    <div class="row2">
      <div>
        <label for="fDate" data-i18n="date_label"></label>
        <input id="fDate" type="date" />
      </div>
      <div>
        <label for="fTime" data-i18n="time_label"></label>
        <input id="fTime" type="time" />
      </div>
    </div>
    <div class="hint" data-i18n="date_hint"></div>
    <label data-i18n="priority_label"></label>
    <div class="seg" id="fPrio">
      <button type="button" class="pl0" data-p="0"></button>
      <button type="button" class="pl1" data-p="1"></button>
      <button type="button" class="pl2" data-p="2"></button>
    </div>
    <label for="fRec" data-i18n="recurrence_label"></label>
    <select id="fRec">
      <option value=""></option>
      <option value="daily"></option>
      <option value="weekly"></option>
      <option value="monthly"></option>
      <option value="yearly"></option>
    </select>
    <label class="chkrow"><input type="checkbox" id="fReminder" /> <span data-i18n="reminder_label"></span></label>
    <label class="chkrow" id="doneChkRow"><input type="checkbox" id="fDone" /> <span data-i18n="done_label"></span></label>
    <div class="row2" id="doneRow" hidden>
      <div>
        <label for="fDoneDate" data-i18n="done_date"></label>
        <input id="fDoneDate" type="date" />
      </div>
      <div>
        <label for="fDoneTime" data-i18n="done_time"></label>
        <input id="fDoneTime" type="time" />
      </div>
    </div>
    <div id="subBlock" hidden>
      <label data-i18n="subtasks_label"></label>
      <div id="subList"></div>
      <div id="subAdd">
        <input type="text" id="subInput" maxlength="200" />
        <button class="btn small accent" id="subAddBtn"></button>
      </div>
    </div>
    <div class="acts">
      <button class="btn danger" id="actDelete" hidden></button>
      <button class="btn" id="actPickDate" hidden></button>
      <button class="btn" id="actCancel"></button>
      <button class="btn accent" id="actSave"></button>
    </div>
  </div>
</div>

<!-- ============ modale conferma ============ -->
<div class="overlay" id="confirmOverlay">
  <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="confirmMsg">
    <h3 data-i18n="confirm_title"></h3>
    <p id="confirmMsg" style="font-size:15px"></p>
    <div class="acts">
      <button class="btn" id="confirmNo"></button>
      <button class="btn danger" id="confirmOk"></button>
    </div>
  </div>
</div>

<!-- ============ modale prompt (nome gruppo/cartella) ============ -->
<div class="overlay" id="promptOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="promptTitle">
    <h3 id="promptTitle"></h3>
    <label for="promptInput" id="promptLabel"></label>
    <input id="promptInput" type="text" maxlength="60" />
    <div class="acts">
      <button class="btn" id="promptNo"></button>
      <button class="btn accent" id="promptOk"></button>
    </div>
  </div>
</div>

<!-- ============ modale "vai a mese e anno" ============ -->
<div class="overlay" id="ymOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="ymTitle">
    <h3 id="ymTitle" data-i18n="pick_month_year"></h3>
    <label for="ymYear" data-i18n="year_label"></label>
    <div class="row2" style="align-items:stretch">
      <button class="btn" id="ymPrev" aria-label="Anno precedente" style="flex:0 0 56px">‹</button>
      <input id="ymYear" type="number" min="1583" max="4000" inputmode="numeric" />
      <button class="btn" id="ymNext" aria-label="Anno successivo" style="flex:0 0 56px">›</button>
    </div>
    <div class="ym-grid" id="ymMonths"></div>
    <div class="acts">
      <button class="btn" id="ymCancel" data-i18n="close"></button>
    </div>
  </div>
</div>

<!-- ============ modale ore di lavoro ============ -->
<div class="overlay" id="whOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="whTitle">
    <h3 id="whTitle" data-i18n="work_hours_title"></h3>
    <label id="whDateLabel"></label>
    <div class="row2">
      <div>
        <label for="whH" data-i18n="hours_short"></label>
        <input id="whH" type="number" min="0" max="24" inputmode="numeric" placeholder="0" />
      </div>
      <div>
        <label for="whM" data-i18n="minutes_short"></label>
        <input id="whM" type="number" min="0" max="59" inputmode="numeric" placeholder="0" />
      </div>
    </div>
    <div class="acts">
      <button class="btn danger" id="whClear" data-i18n="clear"></button>
      <button class="btn" id="whCancel" data-i18n="cancel"></button>
      <button class="btn accent" id="whSave" data-i18n="save"></button>
    </div>
  </div>
</div>

<!-- ============ modale sport (nome + icona) ============ -->
<div class="overlay" id="sportOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="sportTitle">
    <h3 id="sportTitle"></h3>
    <label for="sportName" data-i18n="sport_name_label"></label>
    <input id="sportName" type="text" maxlength="60" />
    <label data-i18n="sport_icon_label"></label>
    <div class="emoji-seg" id="sportIcons"></div>
    <div class="acts">
      <button class="btn" id="sportCancel" data-i18n="cancel"></button>
      <button class="btn accent" id="sportSave" data-i18n="save"></button>
    </div>
  </div>
</div>

<!-- ============ modale esercizio ============ -->
<div class="overlay" id="exOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="exTitle">
    <h3 id="exTitle"></h3>
    <label for="exName" data-i18n="exercise_name_label"></label>
    <input id="exName" type="text" maxlength="120" />
    <div class="row2">
      <div>
        <label for="exSets" data-i18n="sets_label"></label>
        <input id="exSets" type="text" maxlength="20" placeholder="4" />
      </div>
      <div>
        <label for="exReps" data-i18n="reps_label"></label>
        <input id="exReps" type="text" maxlength="40" placeholder="12 / 50m" />
      </div>
    </div>
    <div class="row2">
      <div>
        <label for="exLoad" data-i18n="load_label"></label>
        <input id="exLoad" type="text" maxlength="40" placeholder="60kg" />
      </div>
      <div>
        <label for="exRest" data-i18n="rest_label"></label>
        <input id="exRest" type="text" maxlength="40" placeholder="90s" />
      </div>
    </div>
    <label for="exNotes" data-i18n="exercise_notes_label"></label>
    <textarea id="exNotes" maxlength="500"></textarea>
    <div class="acts">
      <button class="btn danger" id="exDelete" hidden data-i18n="delete"></button>
      <button class="btn" id="exCancel" data-i18n="cancel"></button>
      <button class="btn accent" id="exSave" data-i18n="save"></button>
    </div>
  </div>
</div>

<!-- ============ modale allenamento (diario) ============ -->
<div class="overlay" id="woOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="woTitle">
    <h3 id="woTitle"></h3>
    <label for="woDate" data-i18n="workout_date_label"></label>
    <input id="woDate" type="date" />
    <label for="woPlan" data-i18n="workout_plan_label"></label>
    <select id="woPlan"></select>
    <label data-i18n="workout_duration_label"></label>
    <div class="row2">
      <div>
        <label for="woH" data-i18n="hours_short"></label>
        <input id="woH" type="number" min="0" max="24" inputmode="numeric" placeholder="0" />
      </div>
      <div>
        <label for="woM" data-i18n="minutes_short"></label>
        <input id="woM" type="number" min="0" max="59" inputmode="numeric" placeholder="0" />
      </div>
    </div>
    <label for="woNotes" data-i18n="workout_notes_label"></label>
    <textarea id="woNotes" maxlength="1000"></textarea>
    <div class="acts">
      <button class="btn danger" id="woDelete" hidden data-i18n="delete"></button>
      <button class="btn" id="woCancel" data-i18n="cancel"></button>
      <button class="btn accent" id="woSave" data-i18n="save"></button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
