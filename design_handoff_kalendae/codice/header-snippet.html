<!-- KALENDAE — snippet header per src/index.html.
     Nel browser reale currentColor e var(--neon) funzionano: il logo segue il tema. -->

<!-- 1) SVG defs: incollare subito dopo <body> (una sola volta) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <mask id="kmMask" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <text x="50" y="86" font-family="Cinzel, serif" font-size="96" font-weight="700" text-anchor="middle" fill="#ffffff">K</text>
      <circle cx="62" cy="32" r="12.5" fill="#000000"></circle>
    </mask>
    <symbol id="km" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="currentColor" mask="url(#kmMask)"></rect>
      <path d="M 58 20.2 A 12.5 12.5 0 0 0 58 43.8 A 21 21 0 0 1 58 20.2 Z" fill="var(--neon)"></path>
    </symbol>
  </defs>
</svg>

<!-- 2) Header: sostituire la riga <h1 id="screenTitle">AGENDA/H8</h1> con: -->
<svg class="klogo" aria-hidden="true"><use href="#km"></use></svg>
<h1 id="screenTitle">KALENDAE</h1>

<!-- 3) CSS: aggiungere in coda a layout.css -->
<style>
.klogo { width: 22px; height: 22px; flex: none; color: var(--ink); margin-right: 10px; }
#topbar h1 { font-family: var(--mono); letter-spacing: .2em; color: var(--neon); }
#topbar h1.home { font-family: var(--brand); font-weight: 700; letter-spacing: .22em; color: var(--ink); }
body { font-family: var(--sans); }
</style>

<!-- 4) JS (main.js): dove viene impostato il titolo, aggiungere una riga:
     screenTitle.classList.toggle('home', title === t('app_name'));
     Così "KALENDAE" appare in Cinzel, i nomi di sezione restano mono. -->

     app_name: 'KALENDAE',
     notif_title: 'KALENDAE — promemoria', -->
